name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: true

# The Wixely feed needs a PAT, not the workflow token. GitHub Packages scopes a repository's
# GITHUB_TOKEN to that repository's own packages, so restoring CupriNet.Nodestar from here came
# back 403 Forbidden (NU1301) even with `packages: read` — the token is not the problem, the
# cross-repository grant is. PACKAGES_TOKEN is a PAT with read:packages (and write:packages, so the
# pack job can publish); the fallback keeps forks and PRs building whatever they can reach.
jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Add Wixely feed credentials
        run: dotnet nuget update source GitHub-Wixely-Packages --username ${{ github.actor }} --password "${{ secrets.PACKAGES_TOKEN || github.token }}" --store-password-in-clear-text --configfile NuGet.config
      - name: Restore
        run: dotnet restore Banter.slnx
      - name: Build
        run: dotnet build Banter.slnx --no-restore --configuration Release
      - name: Test
        run: dotnet test Banter.slnx --no-build --configuration Release --logger "trx;LogFileName=results.trx" --results-directory artifacts/test-results
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: artifacts/test-results/*.trx
          if-no-files-found: warn

  pack:
    # The SDK, so a project outside this repository can be a Banter agent — DaggerAgent above all,
    # which cannot implement anything against Banter until it can reference one.
    #
    # `dotnet pack` on the solution produces exactly the four publishable packages and nothing
    # else, because every application and every library with no outside consumer sets
    # IsPackable=false with a reason attached. That is deliberate: it means this job needs no
    # filter, and adding a package is a decision made in the project file rather than here.
    name: Pack the SDK
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      packages: write        # push Banter.* to the Wixely feed, on a v* tag only
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Add Wixely feed credentials
        run: dotnet nuget update source GitHub-Wixely-Packages --username ${{ github.actor }} --password "${{ secrets.PACKAGES_TOKEN || github.token }}" --store-password-in-clear-text --configfile NuGet.config
      - name: Determine version
        id: ver
        shell: bash
        # A tag is the release; anything else is a CI build nobody should depend on, and its
        # version says so.
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.1.0-ci.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          fi
      - name: Pack
        # One version across all four. They are a single surface — an agent takes the SDK and gets
        # the other three behind it — and mixing versions within one surface is exactly the mess
        # that a lockstep release avoids.
        run: dotnet pack Banter.slnx -c Release -p:Version=${{ steps.ver.outputs.version }} -o artifacts/nuget
      - name: Upload packages
        uses: actions/upload-artifact@v7
        with:
          name: nuget-packages
          path: artifacts/nuget/*.nupkg
          if-no-files-found: error
      - name: Push to the Wixely feed (on a v* tag)
        if: startsWith(github.ref, 'refs/tags/v')
        # --skip-duplicate so re-running a tag's workflow is safe rather than a failure.
        run: dotnet nuget push "artifacts/nuget/*.nupkg" --source GitHub-Wixely-Packages --api-key "${{ secrets.PACKAGES_TOKEN || github.token }}" --skip-duplicate

  android:
    # A job of its own, and the Android head is deliberately not in Banter.slnx. Putting it there
    # would make the `android` workload a requirement for anyone building the server or the
    # desktop client, and the README promises a plain `dotnet build Banter.slnx` works.
    name: Build the Android head
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Install the Android workload
        run: dotnet workload install android
      - name: Add Wixely feed credentials
        run: dotnet nuget update source GitHub-Wixely-Packages --username ${{ github.actor }} --password "${{ secrets.PACKAGES_TOKEN || github.token }}" --store-password-in-clear-text --configfile NuGet.config
      - name: Build
        run: dotnet build src/Banter.App.Android/Banter.App.Android.csproj --configuration Release

  web:
    # Out of Banter.slnx for the same reason as the Android head: the `wasm-tools` workload would
    # otherwise be a requirement for anyone building the server or the desktop client.
    name: Build the web head
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Install the WebAssembly workload
        run: dotnet workload install wasm-tools
      - name: Add Wixely feed credentials
        run: dotnet nuget update source GitHub-Wixely-Packages --username ${{ github.actor }} --password "${{ secrets.PACKAGES_TOKEN || github.token }}" --store-password-in-clear-text --configfile NuGet.config
      - name: Publish
        run: dotnet publish src/Banter.App.Web/Banter.App.Web.csproj --configuration Release
