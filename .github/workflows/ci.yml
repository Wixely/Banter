name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: true

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Add Wixely feed credentials
        run: dotnet nuget update source GitHub-Wixely-Packages --username ${{ github.actor }} --password ${{ github.token }} --store-password-in-clear-text --configfile NuGet.config
      - name: Restore
        run: dotnet restore Banter.slnx
      - name: Build
        run: dotnet build Banter.slnx --no-restore --configuration Release
      - name: Test
        run: dotnet test Banter.slnx --no-build --configuration Release --logger "trx;LogFileName=results.trx" --results-directory artifacts/test-results
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: artifacts/test-results/*.trx
          if-no-files-found: warn
