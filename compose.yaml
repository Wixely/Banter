services:
  banter:
    build: .
    image: banter-server
    restart: unless-stopped
    ports:
      - "7770:7770"
    environment:
      # The admin account is created on first run and is always an admin: the oversight rule
      # (PLAN §8a) puts admins into every room an agent opens.
      #
      # CHANGE THIS. It defaults to "admin", and the server says so loudly on startup.
      # Prefer a secret over a literal here - see the commented block below.
      BANTER_ADMIN_PASSWORD: ${BANTER_ADMIN_PASSWORD:-admin}

      # Where it listens, inside the container. Every interface is the right answer there - a
      # container's loopback reaches nothing outside it, including the host - and what to publish
      # is decided by the ports mapping below. Change that, not this, to limit reach:
      #   "127.0.0.1:7770:7770" keeps it on the host's loopback.
      BANTER_ENDPOINT: tcp://0.0.0.0:7770

      # Accounts. The server creates nobody but 'admin' on its own, so people either get added
      # on the users page or are listed here as name:password. Left unset - which is the
      # default - a fresh container comes up with the admin account and no one else.
      #
      # BANTER_SEED_USERS: "alice:secret,bob:secret"
      #
      # Existing accounts are never touched, so this is safe to leave in place across restarts:
      # it will not reset a password somebody has since changed. BANTER_SEED_USERS_FILE reads
      # the same list from a mounted file, for the same reason the admin password can be.

      # SQLite by default. For hosted PostgreSQL:
      #   BANTER_DB: postgres
      #   BANTER_CONNECTION: "Host=db;Database=banter;Username=banter;Password=..."
      BANTER_DB: sqlite
      BANTER_CONNECTION: "Data Source=/data/banter.db"
      BANTER_DATA: /data/files
    volumes:
      # Rooms, history, the work ledger and uploaded files. Without this a restart is a wipe.
      - banter-data:/data

    # Reading the password from a file keeps it out of `docker inspect` and shell history.
    # Uncomment both blocks and drop the value into ./secrets/admin-password.
    # environment:
    #   BANTER_ADMIN_PASSWORD_FILE: /run/secrets/admin-password
    # secrets:
    #   - admin-password

volumes:
  banter-data:

# secrets:
#   admin-password:
#     file: ./secrets/admin-password
